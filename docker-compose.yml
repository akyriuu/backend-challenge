services:
  postgres:
    image: postgres:17-alpine
    container_name: wager-postgres
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - '2004:5432'
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wager -d wager']
      interval: 2s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4
    container_name: wager-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    volumes:
      - ./docker/localstack/init:/etc/localstack/init
    # Espera pelas filas, não pelo serviço: `list-queues` responde antes de o
    # script de init terminar, e `--wait` devolveria com a fila ainda ausente.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          awslocal sqs get-queue-url --queue-name wager-transactions.fifo
          > /dev/null 2>&1 &&
          awslocal sqs get-queue-url --queue-name wager-events.fifo
          > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30