services:
  postgres:
    image: postgres:17-alpine
    container_name: wager-postgres
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - '2004:5432'
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wager -d wager']
      interval: 2s
      timeout: 3s
      retries: 20

  localstack:
    # Versão fixa, não a tag flutuante `4`: o runner parte de cache vazio e
    # puxaria um build diferente do validado aqui, e o healthcheck depende do
    # init hook, cujo comportamento é justamente o que pode mudar entre builds.
    image: localstack/localstack:4.14.0
    container_name: wager-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    volumes:
      - ./docker/localstack/init:/etc/localstack/init
    # Espera pelas filas, não pelo serviço: `list-queues` responde antes de o
    # script de init terminar, e `--wait` devolveria com a fila ainda ausente.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          awslocal sqs get-queue-url --queue-name wager-transactions.fifo
          > /dev/null 2>&1 &&
          awslocal sqs get-queue-url --queue-name wager-events.fifo
          > /dev/null 2>&1
      # Durante o start_period a sonda pode falhar sem condenar o container: o
      # boot leva cerca de 40s, e contar isso como falha é o que transformava
      # runner lento em job vermelho.
      start_period: 40s
      interval: 5s
      timeout: 5s
      retries: 20