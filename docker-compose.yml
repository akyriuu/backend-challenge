services:
  postgres:
    image: postgres:17-alpine
    container_name: wager-postgres
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - '2004:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wager -d wager']
      interval: 2s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4
    container_name: wager-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    volumes:
      - ./docker/localstack/init:/etc/localstack/init
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs list-queues > /dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30